<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" width="1100" height="420" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="How every claim is tested"><title>How every claim is tested</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker></defs><rect width="1100" height="420" fill="#ffffff"/>
<text x="550" y="34" font-size="19" fill="#1f2937" text-anchor="middle" font-weight="600">How every claim is tested</text>
<rect x="20" y="66" width="196" height="150" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="118.0" y="90" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">1  Develop</text>
<text x="118.0" y="113" font-size="12.5" fill="#4b5563" text-anchor="middle">on early data only;</text>
<text x="118.0" y="131.5" font-size="12.5" fill="#4b5563" text-anchor="middle">the later period is</text>
<text x="118.0" y="150.0" font-size="12.5" fill="#4b5563" text-anchor="middle">never loaded</text>
<line x1="216" y1="141" x2="234" y2="141" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="236" y="66" width="196" height="150" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="334.0" y="90" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">2  Freeze the plan</text>
<text x="334.0" y="113" font-size="12.5" fill="#4b5563" text-anchor="middle">hypotheses, tests and</text>
<text x="334.0" y="131.5" font-size="12.5" fill="#4b5563" text-anchor="middle">thresholds written down;</text>
<text x="334.0" y="150.0" font-size="12.5" fill="#4b5563" text-anchor="middle">SHA-256 + git tag</text>
<line x1="432" y1="141" x2="450" y2="141" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="452" y="66" width="196" height="150" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="550.0" y="90" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">3  Unlock</text>
<text x="550.0" y="113" font-size="12.5" fill="#4b5563" text-anchor="middle">the loader opens held-out</text>
<text x="550.0" y="131.5" font-size="12.5" fill="#4b5563" text-anchor="middle">data only if hash, tag</text>
<text x="550.0" y="150.0" font-size="12.5" fill="#4b5563" text-anchor="middle">and flag all match</text>
<line x1="648" y1="141" x2="666" y2="141" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="668" y="66" width="196" height="150" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="766.0" y="90" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">4  Run once</text>
<text x="766.0" y="113" font-size="12.5" fill="#4b5563" text-anchor="middle">on the H100 GPU</text>
<text x="766.0" y="131.5" font-size="12.5" fill="#4b5563" text-anchor="middle">cluster; logs and job</text>
<text x="766.0" y="150.0" font-size="12.5" fill="#4b5563" text-anchor="middle">numbers kept</text>
<line x1="864" y1="141" x2="882" y2="141" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="884" y="66" width="196" height="150" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="982.0" y="90" font-size="14" fill="#1f2937" text-anchor="middle" font-weight="600">5  Report</text>
<text x="982.0" y="113" font-size="12.5" fill="#4b5563" text-anchor="middle">Holm / Benjamini–Yekutieli</text>
<text x="982.0" y="131.5" font-size="12.5" fill="#4b5563" text-anchor="middle">corrections, block</text>
<text x="982.0" y="150.0" font-size="12.5" fill="#4b5563" text-anchor="middle">bootstrap; every change</text>
<text x="982.0" y="168.5" font-size="12.5" fill="#4b5563" text-anchor="middle">logged as a deviation</text>
<text x="20" y="258" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">Held-out periods</text>
<text x="20" y="294" font-size="13" fill="#1f2937" text-anchor="start">State-day study</text>
<rect x="300" y="274" width="648" height="30" fill="#e3eefb" stroke="#2a6fb0"/>
<rect x="948" y="274" width="132" height="30" fill="#fff3e0" stroke="#b26a00"/>
<text x="624.2280285035602" y="294" font-size="12" fill="#4b5563" text-anchor="middle">development: Apr 2018 – Mar 2025</text>
<text x="1014.2280285035602" y="294" font-size="12" fill="#4b5563" text-anchor="middle">held out</text>
<text x="1080" y="322" font-size="11" fill="#4b5563" text-anchor="end">held out: 1 Apr 2025 – 31 Aug 2026</text>
<text x="20" y="364" font-size="13" fill="#1f2937" text-anchor="start">All-India hourly study</text>
<rect x="300" y="344" width="554" height="30" fill="#e3eefb" stroke="#2a6fb0"/>
<rect x="854" y="344" width="226" height="30" fill="#fff3e0" stroke="#b26a00"/>
<text x="576.7741935484025" y="364" font-size="12" fill="#4b5563" text-anchor="middle">development: Nov 2024 – Feb 2026</text>
<text x="966.7741935484025" y="364" font-size="12" fill="#4b5563" text-anchor="middle">held out</text>
<text x="1080" y="392" font-size="11" fill="#4b5563" text-anchor="end">held out: 1 Mar – 13 Sep 2026</text>
</svg>
