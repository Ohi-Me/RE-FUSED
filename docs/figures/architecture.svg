<path d="M 1000 412 L 1000 456" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="275" y1="560" x2="293" y2="560" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="284" y="548" font-size="1" fill="#1f2937" text-anchor="middle"></text>
<path d="M 152 644 L 152 664 L 680 664 L 680 646" fill="none" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="416" y="680" font-size="12" fill="#4b5563" text-anchor="middle" font-style="italic">the same forecasts are corrected</text>
<text x="30" y="714" font-size="14" fill="#1f2937" text-anchor="start" font-weight="600">4  How every claim is tested</text>
<rect x="30" y="726" width="196" height="66" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="128" y="752" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">develop on early data</text>
<text x="128" y="772" font-size="13" fill="#4b5563" text-anchor="middle">only</text>
<line x1="226" y1="759" x2="240" y2="759" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="242" y="726" width="196" height="66" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="340" y="752" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">freeze the plan:</text>
<text x="340" y="772" font-size="13" fill="#4b5563" text-anchor="middle">SHA-256 + git tag</text>
<line x1="438" y1="759" x2="452" y2="759" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="454" y="726" width="196" height="66" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="552" y="752" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">code refuses held-out</text>
<text x="552" y="772" font-size="13" fill="#4b5563" text-anchor="middle">data until frozen</text>
<line x1="650" y1="759" x2="664" y2="759" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="666" y="726" width="196" height="66" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="764" y="752" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">one run on the</text>
<text x="764" y="772" font-size="13" fill="#4b5563" text-anchor="middle">H100 GPU</text>
<line x1="862" y1="759" x2="876" y2="759" stroke="#6b7280" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="878" y="726" width="196" height="66" rx="10" fill="#fff3e0" stroke="#b26a00" stroke-width="1.6"/>
<text x="976" y="752" font-size="13" fill="#1f2937" text-anchor="middle" font-weight="600">corrected tests;</text>
<text x="976" y="772" font-size="13" fill="#4b5563" text-anchor="middle">deviations logged</text>
